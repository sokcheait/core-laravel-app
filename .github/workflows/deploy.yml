name: Deploy to InfinityFree

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, zip, gd, bcmath, intl

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Prepare build environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Arrange files for htdocs
        run: |
          mkdir -p deploy/core-laravel-app
          rsync -a --exclude='public' --exclude='.git' --exclude='.github' --exclude='deploy' --exclude='deploy-index.php' --exclude='.env' --exclude='node_modules' ./ deploy/core-laravel-app/
          cp -r public/. deploy/
          cp deploy-index.php deploy/index.php

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: /htdocs/